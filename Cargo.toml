[package]
name = "KingFish"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }

anyhow = "1.0"
thiserror = "2.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"

rand = "0.8"
base64 = "0.22"

blake3 = "1.5"

directories = "6.0"

quinn = "0.11"
rustls = "0.23"
rcgen = "0.13"

if-addrs = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
